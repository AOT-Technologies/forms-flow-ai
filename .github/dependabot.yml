  # GitHub Actions - pins in .github/workflows. Monday 09:00 IST. One PR for
  # everything; action bumps are low-risk and the Dependency Vulnerability
  # Scan runs on every PR. SHA-pinned actions get the SHA and `# vX` comment
  # bumped together.
  # ===========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      github-actions-all:
        applies-to: "version-updates"
        patterns:
          - "*"
