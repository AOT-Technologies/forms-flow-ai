  # Dependabot PR. model_training is in the same block so the groups span it.
  - package-ecosystem: "pip"
    directories:
      - "/forms-flow-data-analysis-api"
      - "/forms-flow-data-analysis-api/model_training"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"
