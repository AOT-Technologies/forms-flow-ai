      minor-and-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
    ignore:
      # Framework majors are a planned project. Maven names are
      # groupId:artifactId, so the wildcard covers every artifact of the group.
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.camunda*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.keycloak*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jakarta.*"
