# =============================================================================
# Dependabot configuration - forms-flow-ai (open source)
# -----------------------------------------------------------------------------
# Security-first policy. Three kinds of PR per service block:
#
#   security-fixes   ONE grouped PR per service as soon as an alert is raised.
#                    Always targets the default branch (develop).
#   patch-only-safe  ONE grouped PR per service with patch bumps only.
#                    One review pass, merge.
#   minor-and-major  ONE batch PR per service with every minor AND major bump.
#                    Reviewed entry by entry. Not ready for one entry?
#                    Comment `@dependabot ignore <dependency name> major version`
#                    on it and the batch is recreated without it.
#   github-actions   ONE PR for every action bump (github-actions-all).
#
# So each service has at most three open Dependabot PRs. The language
# ecosystems (npm, pip, maven) run DAILY at 09:00 IST; docker and GitHub
# Actions run weekly on Monday 09:00 IST.
#
# Repo facts this file encodes:
#   - Polyglot monorepo of independently built services. PRs are split BY
#     SERVICE on purpose: one update block per service and ecosystem, so every
#     PR lands on exactly one service's path-filtered CI.
#       npm     forms-flow-web (+ scripts), forms-flow-web-root-config
#       pip     forms-flow-api, -api-utils, -documents, -data-layer,
#               -data-analysis-api (+ model_training), jobs/sentiment-analysis,
#               forms-flow-idm/migration  (pinned requirements.txt)
#       maven   forms-flow-bpm (parent pom -> utils + camunda modules),
#               forms-flow-idm/keycloak/* (stand-alone extension poms)
#       docker  one block per service Dockerfile
#   - Group names are the SAME in every block (security-fixes / patch-only-safe
#     / minor-and-major, docker-* for docker, github-actions-all). The
#     directory in the PR title tells the services apart.
#   - Python services use pinned requirements.txt files, so the ecosystem is
#     `pip`. The requirements/*.txt files are unpinned input lists and are not
#     bumped.
#   - NOT covered, by design: the docker-compose files in deployment/, which pin
#     infra images and our own release-tagged images that the release process
#     owns.
#   - Frozen majors: the React 17 / CRA + CRACO / single-spa / formio stack in
#     forms-flow-web, the bundler and lint tooling in forms-flow-web-root-config,
#     and the web/ORM/ML frameworks in the Python and Java services. Lift an
#     ignore when an upgrade is planned.
#   - Default branch is `develop`; no target-branch is set on purpose. Security
#     updates only ever target the default branch, and a non-default
#     target-branch detaches the groups and labels from them. Dependabot reads
#     this file from the default branch only; copies on release branches are
#     kept for reference.
#
# Manual refresh: Insights -> Dependency graph -> Dependabot -> "Check for updates".
# Validation:     Insights -> Dependency graph -> Dependabot (shows config errors).
# =============================================================================
version: 2

updates:
  # ===========================================================================
  # npm - forms-flow-web (React single-spa MFE) + its CD helper package.
  # Daily 09:00 IST. Both directories in one block so the groups span them.
  # ===========================================================================
  - package-ecosystem: "npm"
    directories:
      - "/forms-flow-web"
      - "/forms-flow-web/scripts"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"

    # At most three PRs per block (security, patch, batch). The limit stays at
    # 10 so a recreate is never held back by stale PRs.
    open-pull-requests-limit: 10

    # Bump the range in package.json AND the lockfile (app behaviour).
    versioning-strategy: "increase"

    # Supply-chain cooldown: never take a release the day it is published.
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

    # Labels must already exist in the repo (unknown labels are ignored).
    labels:
      - "dependencies"
      - "javascript"

    pull-request-branch-name:
      separator: "/"

    groups:
      # ONE PR for security fixes, raised as soon as an alert exists.
      security-fixes:
        applies-to: "security-updates"
        patterns:
          - "*"

      # ONE PR for every patch-level bump in this service.
      patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"

      # ONE batch PR for everything else (minor + major).
      minor-and-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

    ignore:
      # React: patch only. forms-flow-web and the micro-front-ends share one
      # React through the root-config import map; a minor/major is cross-repo.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # Build system (CRA + CRACO + single-spa): majors are a planned project.
      - dependency-name: "react-scripts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@craco/craco"
        update-types: ["version-update:semver-major"]
      - dependency-name: "craco-plugin-single-spa-app-aot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "single-spa*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sass"
        update-types: ["version-update:semver-major"]

      # Form engine (AOT formio fork) and the BPMN/DMN modelers.
      - dependency-name: "@aot-technologies/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@formio/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bpmn-js*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dmn-js*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "diagram-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@bpmn-io/*"
        update-types: ["version-update:semver-major"]

      # Shared runtime libraries pinned to a major by the app architecture
      # (react-router-dom v5, react-query v3, keycloak-js 10, RTK 2, redux 4).
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-query"
        update-types: ["version-update:semver-major"]
      - dependency-name: "keycloak-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@reduxjs/toolkit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-bootstrap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]

  # ===========================================================================
  # npm - forms-flow-web-root-config (single-spa shell / import map).
  # ===========================================================================
  - package-ecosystem: "npm"
    directories:
      - "/forms-flow-web-root-config"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    labels:
      - "dependencies"
      - "javascript"
    pull-request-branch-name:
      separator: "/"
    groups:
      security-fixes:
        applies-to: "security-updates"
        patterns:
          - "*"
      patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-and-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
    ignore:
      # Bundler / runtime loader (shared with forms-flow-web and the MFEs).
      - dependency-name: "webpack*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*-webpack-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "single-spa*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # Intentional tooling versions (eslint 7, prettier 2).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pretty-quick"
        update-types: ["version-update:semver-major"]

  # ===========================================================================
  # pip - Python services (pinned requirements.txt), one block per service.
  # Daily 09:00 IST. The ignore list is repeated per block because Dependabot
  # has no shared config.
  # ===========================================================================
  - package-ecosystem: "pip"
    directories:
      - "/forms-flow-api"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    labels:
