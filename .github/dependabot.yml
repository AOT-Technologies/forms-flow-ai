  # ===========================================================================
  # maven - forms-flow-bpm (Spring Boot + Camunda 7 CE). Daily 09:00 IST.
  # The parent pom declares the utils and camunda modules; Dependabot follows
  # <modules> from the parent, so one directory covers all three poms.
  # Versions are Maven properties (version.camunda, version.springBoot, ...),
  # which Dependabot bumps in place.
  # ===========================================================================
  - package-ecosystem: "maven"
    directories:
      - "/forms-flow-bpm"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    labels:
      - "dependencies"
      - "java"
    pull-request-branch-name:
      separator: "/"
    groups:
      security-fixes:
        applies-to: "security-updates"
        patterns:
          - "*"
      patch-only-safe:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
