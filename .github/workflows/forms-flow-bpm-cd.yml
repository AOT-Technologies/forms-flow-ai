name: CD - BPM

on:
  workflow_dispatch:
  push:
    branches: [ master, develop, release/* ] 
    paths:
      - "forms-flow-bpm/**"
      - "VERSION"

defaults:
  run:
    shell: bash

jobs:

  # ============================================================
  # 1. BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push-image-to-dockerhub:
    if: github.repository == 'AOT-Technologies/forms-flow-ai'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: formsflow/forms-flow-bpm
            context: forms-flow-bpm
            dockerfile: Dockerfile
            name: forms-flow-bpm
    outputs:
      image: ${{ steps.image-output.outputs.image }}   
      digest: ${{ steps.image-output.outputs.digest }}

    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0

      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          install: true
      # ----------------------------------------------------------
      # Version
      # ----------------------------------------------------------
      - name: Set version
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Set version
        if: ${{ github.ref == 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV

      - run: echo ${{ env.VERSION }}
      # ----------------------------------------------------------
      # Docker metadata
      # ----------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ matrix.image }}
          tags: ${{ env.VERSION }}
      
      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}
      # ----------------------------------------------------------
      # Docker layer cache
      # ----------------------------------------------------------
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}

      # ----------------------------------------------------------
      # Multi-architecture support
      # ----------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container


      # ----------------------------------------------------------
      # Build and push - non-master
      # ----------------------------------------------------------
      - name: Build and push Docker image (Non-master branch)
        id: docker-push-nonmaster
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: forms-flow-bpm
          push: true
          file: forms-flow-bpm/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # ----------------------------------------------------------
      # Build and push - master
      # ----------------------------------------------------------
      - name: Build and push Docker image (Master branch)
        id: docker-push-master
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: forms-flow-bpm
          push: true
          platforms: linux/amd64,linux/arm64/v8
          file: forms-flow-bpm/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}, formsflow/forms-flow-bpm:latest
          labels: ${{ steps.meta.outputs.labels }}
      # ----------------------------------------------------------
      # Sign image by immutable digest
      # ----------------------------------------------------------
      - name: Sign published Docker image
        env:
          DIGEST: ${{ github.ref == 'refs/heads/master' && steps.docker-push-master.outputs.digest || steps.docker-push-nonmaster.outputs.digest }}
        run: |
          set -euo pipefail

          IMAGE="formsflow/forms-flow-bpm"

          echo "Signing:"
          echo "${IMAGE}@${DIGEST}"

          cosign sign --yes "${IMAGE}@${DIGEST}"


      # ----------------------------------------------------------
      # Image output
      # ----------------------------------------------------------
      - name: Set image output
        id: image-output
        if: ${{ steps.docker-push-nonmaster.outcome == 'success' || steps.docker-push-master.outcome == 'success' }}
        run: |
          IMAGE="${{ matrix.image }}:${{ env.VERSION }}"
          DIGEST="${{ github.ref == 'refs/heads/master' && steps.docker-push-master.outputs.digest || steps.docker-push-nonmaster.outputs.digest }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "$IMAGE"

          echo "Docker digest:"
          echo "$DIGEST"

  # ============================================================
  # 2. DOCKER PUSH NOTIFICATION
  # ============================================================
  docker-notification:
    name: Docker Push Notification

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: docker
      status: ${{ needs.build-and-push-image-to-dockerhub.result }}
      component: "forms-flow-bpm"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit


  # ============================================================
  # 3. DEPLOY TO DEV EKS
  # ============================================================
  deploy-to-dev-eks:
    name: Deploy Forms Flow BPM to DEV EKS

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ needs.build-and-push-image-to-dockerhub.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.REGION }}
      IMAGE: formsflow/forms-flow-bpm@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Verify signed Docker image
      # ----------------------------------------------------------
      - name: Verify signed Docker image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $IMAGE"
          if cosign verify \
            "$IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/forms-flow-bpm-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $IMAGE"
          else
            echo "ERROR: Image signature verification failed for $IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # AWS GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        env:
          DEV_EKS_CLUSTER: ${{ secrets.DEV_EKS_CLUSTER }}
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$DEV_EKS_CLUSTER"

      # ----------------------------------------------------------
      # Verify Kubernetes access
      # ----------------------------------------------------------
      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl cluster-info
          

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------
      - name: Show deployment image
        run: |
          echo "Deploying:"
          echo "$IMAGE"

      # ========================================================
      # DEV OPENSOURCE NAMESPACE
      # ========================================================
      - name: Deploy to DEV OPENSOURCE namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.DEV_OPENSOURCE_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$IMAGE"

          kubectl -n "$NAMESPACE" \
            patch deployment forms-flow-bpm \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-bpm","image":"'"$IMAGE"'"}]}}}}'

          kubectl -n "$NAMESPACE" \
            rollout restart deployment forms-flow-bpm

          kubectl -n "$NAMESPACE" \
            rollout status deployment forms-flow-bpm \
            --timeout=10m


      # ----------------------------------------------------------
      # Verify deployments
      # ----------------------------------------------------------
      - name: Verify deployments
        shell: bash
        env:
          NAMESPACE: ${{ secrets.DEV_OPENSOURCE_NAMESPACE }}
        run: |
          echo "DEV OPENSOURCE:"
          kubectl -n "$NAMESPACE" \
            get deployment forms-flow-bpm

  # ============================================================
  # 4. DEPLOY TO QA EKS
  # ============================================================
  deploy-to-qa-eks:
    name: Deploy Forms Flow BPM to QA EKS

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ needs.build-and-push-image-to-dockerhub.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.REGION }}
      IMAGE: formsflow/forms-flow-bpm@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Verify signed Docker image
      # ----------------------------------------------------------
      - name: Verify signed Docker image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $IMAGE"
          if cosign verify \
            "$IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/forms-flow-bpm-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $IMAGE"
          else
            echo "ERROR: Image signature verification failed for $IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # AWS GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        env:
          QA_EKS_CLUSTER: ${{ secrets.QA_EKS_CLUSTER }}
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$QA_EKS_CLUSTER"

      # ----------------------------------------------------------
      # Verify Kubernetes access
      # ----------------------------------------------------------
      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl cluster-info
          

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------
      - name: Show deployment image
        run: |
          echo "Deploying:"
          echo "$IMAGE"

      # ========================================================
      # QA OPENSOURCE NAMESPACE
      # ========================================================
      - name: Deploy to QA OPENSOURCE namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.QA_OPENSOURCE_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$IMAGE"

          kubectl -n "$NAMESPACE" \
            patch deployment forms-flow-bpm \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-bpm","image":"'"$IMAGE"'"}]}}}}'

          kubectl -n "$NAMESPACE" \
            rollout restart deployment forms-flow-bpm

          kubectl -n "$NAMESPACE" \
            rollout status deployment forms-flow-bpm \
            --timeout=10m

      # ----------------------------------------------------------
      # Verify deployments
      # ----------------------------------------------------------
      - name: Verify deployments
        shell: bash
        env:
          NAMESPACE: ${{ secrets.QA_OPENSOURCE_NAMESPACE }}
        run: |
          echo "QA OPENSOURCE:"
          kubectl -n "$NAMESPACE" \
            get deployment forms-flow-bpm

  # ============================================================
  # 5. KUBERNETES DEV DEPLOYMENT NOTIFICATION
  # ============================================================
  kubernetes-notification-dev:
    name: Kubernetes DEV Deployment Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: kubernetes
      status: ${{ needs.deploy-to-dev-eks.result }}
      component: "forms-flow-bpm"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "DEV"
      namespace: "DEV OPENSOURCE"
      deployment: "forms-flow-bpm"

    secrets: inherit

  # ============================================================
  # 6. KUBERNETES QA DEPLOYMENT NOTIFICATION
  # ============================================================
  kubernetes-notification-qa:
    name: Kubernetes QA Deployment Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-qa-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: kubernetes
      status: ${{ needs.deploy-to-qa-eks.result }}
      component: "forms-flow-bpm"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "QA"
      namespace: "QA OPENSOURCE"
      deployment: "forms-flow-bpm"

    secrets: inherit

  # ============================================================
  # 7. CALCULATE OVERALL WORKFLOW STATUS
  # ============================================================
  workflow-status:
    name: Calculate Overall Workflow Status

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks
      - deploy-to-qa-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.status.outputs.status }}

    steps:
      - name: Calculate status
        id: status
        shell: bash
        run: |
          BUILD_RESULT="${{ needs.build-and-push-image-to-dockerhub.result }}"
          DEV_RESULT="${{ needs.deploy-to-dev-eks.result }}"
          QA_RESULT="${{ needs.deploy-to-qa-eks.result }}"

          echo "Build result: $BUILD_RESULT"
          echo "DEV Deploy result: $DEV_RESULT"
          echo "QA Deploy result: $QA_RESULT"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEV_RESULT" = "success" ] && [ "$QA_RESULT" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # 8. OVERALL WORKFLOW NOTIFICATION
  # ============================================================
  workflow-notification:
    name: Overall Workflow Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks
      - deploy-to-qa-eks
      - workflow-status

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: workflow
      status: ${{ needs.workflow-status.outputs.status }}
      component: "forms-flow-bpm"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "DEV + QA"
      namespace: "DEV (Open Source) + QA (Open Source)"
      deployment: "forms-flow-bpm"

    secrets: inherit


  # ============================================================
  # 7. ZAP SCAN
  # ============================================================
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the application

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master

      - name: Prepare ZAP directory
        run: |
          mkdir -p zap-reports

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@bee4e5be916301228d2b1b2dcad73aab6fa6a25b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ secrets.BPM_TARGET_URL }}
          rules_file_name: '.zap/rules.tsv'
          issue_title: 'ZAP Full Scan Report'
          fail_action: false
          allow_issue_writing: true
          artifact_name: zap_scan

      - name: Locate ZAP reports
        run: |
          echo "Workspace:"
          pwd

          echo "Generated files:"
          find . -maxdepth 3 -type f \( \
            -name 'report_html.html' \
            -o -name 'report_json.json' \
            -o -name 'report_md.md' \
          \) -print

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ZAP_SCAN_REPORT_S3_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      - name: Upload ZAP HTML Report to S3
        run: |
          set -euo pipefail

          REPORT=$(find . -type f -name 'report_html.html' -print -quit)

          if [ -z "$REPORT" ]; then
            echo "ERROR: ZAP HTML report was not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Uploading ZAP report: $REPORT"

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)

          aws s3 cp "$REPORT" \
            "s3://zap-report-formsflow/zap-reports/zap-report-${TIMESTAMP}.html"

          echo "ZAP report uploaded successfully"