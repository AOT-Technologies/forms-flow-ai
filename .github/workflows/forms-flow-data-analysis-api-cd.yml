name: Push Forms flow Analysis API to registry

on:
  workflow_dispatch:
  push:
    branches: [ master, develop, release/* ]
    paths:
      - "forms-flow-data-analysis-api/**"
      - "VERSION"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-data-analysis-api


jobs:
  build-and-push-image-to-dockerhub:
    if: github.repository == 'AOT-Technologies/forms-flow-ai'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: formsflow/forms-flow-data-analysis-api
            context: forms-flow-data-analysis-api
            dockerfile: Dockerfile
            name: forms-flow-data-analysis-api
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set version
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> "$GITHUB_ENV"
      - name: Set version
        if: ${{ github.ref == 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - run: echo "VERSION=${{ env.VERSION }}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}

      # Docker Hub login with a short-lived OIDC token (same as the other CD workflows)
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container

      - name: Build and push Docker image (Non-master branch)
        id: docker-push-nonmaster
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: forms-flow-data-analysis-api
          file: forms-flow-data-analysis-api/Dockerfile
          build-args: MODEL_ID=Seethal/sentiment_analysis_generic_dataset
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image (Master branch)
        id: docker-push-master
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: forms-flow-data-analysis-api
          file: forms-flow-data-analysis-api/Dockerfile
          build-args: MODEL_ID=Seethal/sentiment_analysis_generic_dataset
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}, formsflow/forms-flow-data-analysis-api:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign published Docker image
        env:
          DIGEST: ${{ github.ref == 'refs/heads/master' && steps.docker-push-master.outputs.digest || steps.docker-push-nonmaster.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="formsflow/forms-flow-data-analysis-api"
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan Docker image 🐳
        uses: snyk/actions/docker@master
        continue-on-error: true
        with:
          image: ${{ steps.meta.outputs.tags }}
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

