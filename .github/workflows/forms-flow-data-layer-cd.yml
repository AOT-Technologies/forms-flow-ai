name: Push Forms flow data layer to registry

on:
  workflow_dispatch:
  push:
    branches: [ master, develop, release/* ]
    paths:
      - "forms-flow-data-layer/**"
      - "VERSION"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-data-layer


jobs:
  build-and-push-image-to-dockerhub:
    if: github.repository == 'AOT-Technologies/forms-flow-ai'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: formsflow/forms-flow-data-layer
            context: forms-flow-data-layer
            dockerfile: Dockerfile
            name: forms-flow-data-layer
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Set version
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV
      
      - name: Set version
        if: ${{ github.ref == 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV
      
      - run: echo ${{ env.VERSION }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ matrix.image }}
          tags: ${{ env.VERSION }}

      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 3600
      - name: Docker login
        uses: docker/login-action@v4
        with:
         username: ${{ secrets.DOCKER_HUB_USERNAME }}
         password: ${{ steps.docker_oidc.outputs.token }}
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}
            
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          version: latest
      - name: Build and push Docker image
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: docker/build-push-action@v7
        with:
          context: forms-flow-data-layer
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push Docker image
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/build-push-action@v7
        with:
          context: forms-flow-data-layer
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}, formsflow/forms-flow-data-layer:latest
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan Docker image 🐳
        uses: snyk/actions/docker@master
        continue-on-error: true
        with:
          image: ${{ steps.meta.outputs.tags }}
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk report as sarif 📦
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Update Kube config
        run: aws eks update-kubeconfig --region ca-central-1 --name ${{ secrets.DEV_EKS_CLUSTER }}

      - name: Deploy to eks
        run: |
          kubectl -n ${{ secrets.DEV_OPENSOURCE_NAMESPACE }} patch deployment forms-flow-bpm -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-bpm","image":"docker.io/formsflow/forms-flow-bpm:${{ env.VERSION }}"}]}}}}'
          kubectl -n ${{ secrets.DEV_OPENSOURCE_NAMESPACE }} rollout restart deployment forms-flow-bpm
         
      - name: Notify Google Chat - Success
        if: ${{ success() }}
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DOCKER_HUB_DEPLOY_GOOGLE_CHAT_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          curl --fail-with-body -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$(jq -n \
              --arg repository "${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg tags "$IMAGE_TAGS" \
              --arg actor "${{ github.actor }}" \
              --arg sha "${{ github.sha }}" \
              --arg workflow "${{ github.workflow }}" \
              --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                text: (
                  "🐳 *Docker Image Released Successfully* 🚀\n\n" +
                  "*Repository:* " + $repository + "\n" +
                  "*Branch:* " + $branch + "\n" +
                  "*Image:* " + $tags + "\n" +
                  "*Commit:* " + $sha + "\n" +
                  "*Triggered by:* " + $actor + "\n\n" +
                  "🔗 " + $run_url
                )
              }')" \
            "$GOOGLE_CHAT_WEBHOOK_URL"

      - name: Notify Google Chat - Failure
        if: ${{ failure() }}
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DOCKER_HUB_DEPLOY_GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$(jq -n \
              --arg repository "${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg actor "${{ github.actor }}" \
              --arg workflow "${{ github.workflow }}" \
              --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                text: (
                  "❌ *Docker Image Release Failed*\n\n" +
                  "*Repository:* " + $repository + "\n" +
                  "*Branch:* " + $branch + "\n" +
                  "*Workflow:* " + $workflow + "\n" +
                  "*Triggered by:* " + $actor + "\n\n" +
                  "🔗 Check the workflow:\n" + $run_url
                )
              }')" \
            "$GOOGLE_CHAT_WEBHOOK_URL"  