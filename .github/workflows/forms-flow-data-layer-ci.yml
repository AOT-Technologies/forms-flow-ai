name: CI - Data Layer

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - master
      - release/**
    paths:
      - "forms-flow-data-layer/**"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-data-layer

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version:
          - "3.12.10"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: forms-flow-data-layer/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Pylint
        run: |
          pylint --rcfile=setup.cfg src

      - name: Flake8
        run: |
          flake8 src tests

  test:
    name: Test
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        python-version:
          - "3.13.16"

    env:
      JWT_OIDC_JWKS_URI: "http://localhost:8081/auth/realms/forms-flow-ai/protocol/openid-connect/certs"
      JWT_OIDC_ISSUER: "http://localhost:8081/auth/realms/forms-flow-ai"
      JWT_OIDC_AUDIENCE: "forms-flow-web"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: forms-flow-data-layer/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run tests
        run: |
          pytest

  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag forms-flow-data-layer:ci \
            .

      - name: Verify Docker image
        run: |
          docker image inspect forms-flow-data-layer:ci

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:  
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag forms-flow-data-layer:ci \
            .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: forms-flow-data-layer:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: forms-flow-data-layer/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Authenticate Snyk
        run: |
          snyk auth "$SNYK_TOKEN"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Open Source
        continue-on-error: true
        run: |
          snyk test \
            --file=requirements/dev.txt \
            --package-manager=pip \
            --severity-threshold=high

      - name: Snyk Code
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=high
 