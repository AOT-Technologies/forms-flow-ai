name: CD - Forms Flow Root Config

on:
  workflow_dispatch:
  push:
    branches: [ master, develop, release/* ]
    paths:
      - "forms-flow-web-root-config/**"
      - "VERSION"

defaults:
  run:
    shell: bash

jobs:

# ============================================================

# 1. BUILD AND PUSH DOCKER IMAGE

# ============================================================

  build-and-push-image-to-dockerhub:
    if: github.repository == 'AOT-Technologies/forms-flow-ai'
    runs-on: ubuntu-latest

     
    strategy:
      matrix:
        include:
          - image: formsflow/forms-flow-web
            context: forms-flow-web-root-config
            dockerfile: Dockerfile
            name: forms-flow-web

    outputs:
      image: ${{ steps.image-output.outputs.image }}
      digest: ${{ steps.image-output.outputs.digest }}

    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          install: true

      # ----------------------------------------------------------
      # Version
      # ----------------------------------------------------------
      - name: Set version
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Set version
        if: ${{ github.ref == 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Show version
        run: echo "VERSION=${{ env.VERSION }}"

      # ----------------------------------------------------------
      # Docker metadata
      # ----------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Docker layer cache
      # ----------------------------------------------------------
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}

      # ----------------------------------------------------------
      # Multi-architecture support
      # ----------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container

      # ----------------------------------------------------------
      # Build and push - non-master
      # ----------------------------------------------------------
      - name: Build and push Docker image (Non-master branch)
        id: docker-push-nonmaster
        if: ${{ github.ref != 'refs/heads/master' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: forms-flow-web-root-config
          file: forms-flow-web-root-config/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MF_FORMSFLOW_WEB_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-web@${{ env.VERSION }}/forms-flow-web.gz.js
            MF_FORMSFLOW_NAV_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-nav@${{ env.VERSION }}/forms-flow-nav.gz.js
            MF_FORMSFLOW_SERVICE_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-service@${{ env.VERSION }}/forms-flow-service.gz.js
            MF_FORMSFLOW_COMPONENTS_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-components@${{ env.VERSION }}/forms-flow-components.gz.js
            MF_FORMSFLOW_ADMIN_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-admin@${{ env.VERSION }}/forms-flow-admin.gz.js
            MF_FORMSFLOW_REVIEW_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-review@${{ env.VERSION }}/forms-flow-review.gz.js
            MF_FORMSFLOW_SUBMISSIONS_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-submissions@${{ env.VERSION }}/forms-flow-submissions.gz.js

      # ----------------------------------------------------------
      # Build and push - master
      # ----------------------------------------------------------
      - name: Build and push Docker image (Master branch)
        id: docker-push-master
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: forms-flow-web-root-config
          file: forms-flow-web-root-config/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }},formsflow/forms-flow-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MF_FORMSFLOW_WEB_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-web@${{ env.VERSION }}/forms-flow-web.gz.js
            MF_FORMSFLOW_NAV_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-nav@${{ env.VERSION }}/forms-flow-nav.gz.js
            MF_FORMSFLOW_SERVICE_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-service@${{ env.VERSION }}/forms-flow-service.gz.js
            MF_FORMSFLOW_COMPONENTS_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-components@${{ env.VERSION }}/forms-flow-components.gz.js
            MF_FORMSFLOW_ADMIN_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-admin@${{ env.VERSION }}/forms-flow-admin.gz.js 
            MF_FORMSFLOW_REVIEW_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-review@${{ env.VERSION }}/forms-flow-review.gz.js
            MF_FORMSFLOW_SUBMISSIONS_URL=https://forms-flow-microfrontends.aot-technologies.com/forms-flow-submissions@${{ env.VERSION }}/forms-flow-submissions.gz.js

      # ----------------------------------------------------------
      # Sign image by immutable digest
      # ----------------------------------------------------------
      - name: Sign published Docker image
        env:
          DIGEST: ${{ github.ref == 'refs/heads/master' && steps.docker-push-master.outputs.digest || steps.docker-push-nonmaster.outputs.digest }}
        run: |
          set -euo pipefail

          IMAGE="formsflow/forms-flow-web"

          echo "Signing:"
          echo "${IMAGE}@${DIGEST}"

          cosign sign --yes "${IMAGE}@${DIGEST}"

      # ----------------------------------------------------------
      # Image output
      # ----------------------------------------------------------
      - name: Set image output
        id: image-output
        if: ${{ steps.docker-push-nonmaster.outcome == 'success' || steps.docker-push-master.outcome == 'success' }}
        run: |
          IMAGE="${{ matrix.image }}:${{ env.VERSION }}"
          DIGEST="${{ github.ref == 'refs/heads/master' && steps.docker-push-master.outputs.digest || steps.docker-push-nonmaster.outputs.digest }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "$IMAGE"

          echo "Docker digest:"
          echo "$DIGEST"
     

  # ============================================================

  # 2. DOCKER PUSH NOTIFICATION

  # ============================================================

  docker-notification:
    name: Docker Push Notification

     
    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: docker
      status: ${{ needs.build-and-push-image-to-dockerhub.result }}
      component: "forms-flow-web"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    secrets: inherit
     

  # ============================================================

  # 3. DEPLOY TO EKS

  # ============================================================
  # ============================================================
  # 3. DEPLOY TO DEV EKS
  # ============================================================
  deploy-to-dev-eks:
    name: Deploy Forms Flow Root Config to DEV EKS

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ needs.build-and-push-image-to-dockerhub.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.REGION }}
      IMAGE: formsflow/forms-flow-web@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Verify signed Docker image
      # ----------------------------------------------------------
      - name: Verify signed Docker image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $IMAGE"
          if cosign verify \
            "$IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/forms-flow-root-config-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $IMAGE"
          else
            echo "ERROR: Image signature verification failed for $IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # AWS GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ secrets.DEV_EKS_CLUSTER }}"

      # ----------------------------------------------------------
      # Verify Kubernetes access
      # ----------------------------------------------------------
      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl cluster-info
          

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------
      - name: Show deployment image
        run: |
          echo "Deploying:"
          echo "$IMAGE"

      # ========================================================
      # DEV OPEN SOURCE NAMESPACE
      # ========================================================
      - name: Deploy to DEV Open source namespace
        shell: bash
        run: |
          NAMESPACE="${{ secrets.DEV_OPENSOURCE_NAMESPACE }}"

          echo "Deploying image:"
          echo "$IMAGE"

          kubectl -n "$NAMESPACE" \
            patch deployment forms-flow-web \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-web","image":"'"$IMAGE"'"}]}}}}'

          kubectl -n "$NAMESPACE" \
            rollout restart deployment forms-flow-web

          kubectl -n "$NAMESPACE" \
            rollout status deployment forms-flow-web \
            --timeout=5m

      # ----------------------------------------------------------
      # Verify deployments
      # ----------------------------------------------------------
      - name: Verify deployments
        shell: bash
        run: |
          echo "DEV Open Source:"
          kubectl -n "${{ secrets.DEV_OPENSOURCE_NAMESPACE }}" \
            get deployment forms-flow-web

  # ============================================================
  # 4. DEPLOY TO QA EKS
  # ============================================================
  deploy-to-qa-eks:
    name: Deploy Forms Flow Root Config to QA EKS

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ needs.build-and-push-image-to-dockerhub.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.REGION }}
      IMAGE: formsflow/forms-flow-web@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Verify signed Docker image
      # ----------------------------------------------------------
      - name: Verify signed Docker image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $IMAGE"
          if cosign verify \
            "$IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/forms-flow-root-config-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $IMAGE"
          else
            echo "ERROR: Image signature verification failed for $IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # AWS GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ secrets.QA_EKS_CLUSTER }}"

      # ----------------------------------------------------------
      # Verify Kubernetes access
      # ----------------------------------------------------------
      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl cluster-info
          

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------
      - name: Show deployment image
        run: |
          echo "Deploying:"
          echo "$IMAGE"

      # ========================================================
      # QA OPEN SOURCE NAMESPACE
      # ========================================================
      - name: Deploy to QA Open Source namespace
        shell: bash
        run: |
          NAMESPACE="${{ secrets.QA_OPENSOURCE_NAMESPACE }}"

          echo "Deploying image:"
          echo "$IMAGE"

          kubectl -n "$NAMESPACE" \
            patch deployment forms-flow-web \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-web","image":"'"$IMAGE"'"}]}}}}'

          kubectl -n "$NAMESPACE" \
            rollout restart deployment forms-flow-web

          kubectl -n "$NAMESPACE" \
            rollout status deployment forms-flow-web \
            --timeout=5m

      # ----------------------------------------------------------
      # Verify deployments
      # ----------------------------------------------------------
      - name: Verify deployments
        shell: bash
        run: |
          echo "QA Open Source:"
          kubectl -n "${{ secrets.QA_OPENSOURCE_NAMESPACE }}" \
            get deployment forms-flow-web

  # ============================================================
  # 5. KUBERNETES DEV DEPLOYMENT NOTIFICATION
  # ============================================================
  kubernetes-notification-dev:
    name: Kubernetes DEV Deployment Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: kubernetes
      status: ${{ needs.deploy-to-dev-eks.result }}
      component: "forms-flow-web"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "DEV"
      namespace: "DEV Open source"
      deployment: "forms-flow-web"

    secrets: inherit

  # ============================================================
  # 6. KUBERNETES QA DEPLOYMENT NOTIFICATION
  # ============================================================
  kubernetes-notification-qa:
    name: Kubernetes QA Deployment Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-qa-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: kubernetes
      status: ${{ needs.deploy-to-qa-eks.result }}
      component: "forms-flow-web"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "QA"
      namespace: "QA Open source"
      deployment: "forms-flow-web"

    secrets: inherit

  # ============================================================
  # 7. CALCULATE OVERALL WORKFLOW STATUS
  # ============================================================
  workflow-status:
    name: Calculate Overall Workflow Status

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks
      - deploy-to-qa-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.status.outputs.status }}

    steps:
      - name: Calculate status
        id: status
        shell: bash
        run: |
          BUILD_RESULT="${{ needs.build-and-push-image-to-dockerhub.result }}"
          DEV_RESULT="${{ needs.deploy-to-dev-eks.result }}"
          QA_RESULT="${{ needs.deploy-to-qa-eks.result }}"

          echo "Build result: $BUILD_RESULT"
          echo "DEV Deploy result: $DEV_RESULT"
          echo "QA Deploy result: $QA_RESULT"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEV_RESULT" = "success" ] && [ "$QA_RESULT" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # 8. OVERALL WORKFLOW NOTIFICATION
  # ============================================================
  workflow-notification:
    name: Overall Workflow Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks
      - deploy-to-qa-eks
      - workflow-status

    if: ${{ always() && github.repository == 'AOT-Technologies/forms-flow-ai' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: workflow
      status: ${{ needs.workflow-status.outputs.status }}
      component: "forms-flow-web"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "DEV + QA"
      namespace: "DEV (Open Source) & QA (Open Source)"
      deployment: "forms-flow-web"

    secrets: inherit
 
