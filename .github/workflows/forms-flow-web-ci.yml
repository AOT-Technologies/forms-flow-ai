name: CI - Web

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - master
      - release/**
      - feature/**
    paths:
      - "forms-flow-web/**"
      - "VERSION"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

  test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.21.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Unit tests
        run: |
          npm run lint
