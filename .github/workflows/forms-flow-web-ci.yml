name: CI - Web

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - master
      - release/**
      - feature/**
    paths:
      - "forms-flow-web/**"
      - "VERSION"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

  test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Unit tests
        run: |
          npm test

  build:
    name: Build
    needs:
      - lint
      - test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

  trivy:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag forms-flow-web:ci \
            .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: forms-flow-web:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"

      - name: Snyk Open Source
        continue-on-error: true
        run: |
          snyk test \
            --file=package-lock.json \
            --package-manager=npm \
            --severity-threshold=high

      - name: Snyk Code
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=high
