name: CI - Web

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - master
      - release/**
      - feature/**
    paths:
      - "forms-flow-web/**"
      - "VERSION"

defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

  test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.21.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Unit tests
        run: |
          npm run lint
  # Test:
  #   if: Always()
  #   needs: setup-job
  #   runs-on: ubuntu-24.04

  #   strategy:
  #     matrix:
  #       node-version: [24.21.0]

  #   steps:
  #     - uses: actions/checkout@v2
  #     - name: Use Node.js ${{ matrix.node-version }}
  #       uses: actions/setup-node@v1
  #       with:
  #         node-version: ${{ matrix.node-version }}
  #     - name: Install dependencies
  #       run: |
  #         npm ci
  #     - name: Unit Test
  #       id: test
  #       run: |
  #         npm test a

  Build:
    if: always()
    needs: setup-job
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.21.0]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

  trivy:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag forms-flow-web:ci \
            .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: forms-flow-web:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        node-version:
          - "18.20.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: forms-flow-web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"

      - name: Snyk Open Source
        continue-on-error: true
        run: |
          snyk test \
            --file=package-lock.json \
            --package-manager=npm \
            --severity-threshold=high

      - name: Snyk Code
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=high
