name: PR Notification to Google Chat

# Uses pull_request_target so fork PRs can read the PR_NOTIFICATION webhook secret.
# It never checks out or runs PR code. From 2026-12-02 GitHub blocks
# pull_request_target in public repos unless an Actions event policy allows it,
# so this file must be on that policy's allowlist.
on:
  pull_request_target:
    types: [opened, synchronize, closed]
    branches:
      - develop

# This job doesn't use the GITHUB_TOKEN.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.base.repo.full_name == 'AOT-Technologies/forms-flow-ai' && github.event.pull_request.draft == false }}

    steps:
      - name: Determine PR Status
        id: pr_status
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [[ "$PR_ACTION" == "opened" ]]; then
            echo "status=🟢 Open" >> $GITHUB_ENV
          elif [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            echo "status=🟣 Merged" >> $GITHUB_ENV
          elif [[ "$PR_ACTION" == "closed" ]]; then
            echo "status=🔴 Closed" >> $GITHUB_ENV
          else
            echo "status=🟢 Open" >> $GITHUB_ENV
          fi

      - name: Send notification to Google Chat
        uses: fjogeleit/http-request-action@dea46570591713c7de04a5b556bf2ff7bdf0aa9c # v1.16.0
        with:
          url: ${{ secrets.PR_NOTIFICATION }}
          method: POST
          contentType: application/json
          data: |
            {
              "cards": [
                {
                  "header": {
                    "title": "Open source: Pull Request Opened by ${{ github.event.pull_request.user.login }}",
                    "subtitle": ${{ toJSON(format('Pull Request #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)) }},
                    "imageUrl": "${{ github.event.pull_request.user.avatar_url }}"
                  },
                  "sections": [
                    {
                      "widgets": [
                        {
                          "textParagraph": {
                            "text": "Repository: ${{ github.repository }}"
                          }
                        },
                        {
                          "textParagraph": {
                            "text": "Status: ${{ env.status }}"
                          }
                        },
                        {
                          "buttons": [
                            {
                              "textButton": {
                                "text": "View Pull Request",
                                "onClick": {
                                  "openLink": {
                                    "url": "${{ github.event.pull_request.html_url }}"
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            }