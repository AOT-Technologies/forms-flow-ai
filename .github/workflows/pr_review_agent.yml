name: PR Review Agent

# Uses pull_request_target so fork PRs get OPENAI_KEY and a write token.
# It never checks out or runs PR code: PR Agent reads the diff via the API.
# From 2026-12-02 GitHub blocks pull_request_target in public repos unless an
# Actions event policy allows it, so this file must be on that policy's allowlist.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - develop
      - master
      - release/**
  issue_comment:

permissions:
  contents: read # write is only needed for /update_changelog, which isn't used
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    # Comment commands only run on PRs, and only for trusted commenters, so outside
    # users can't spend the OpenAI key or drive a bot that has write access.
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.sender.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    name: Run PR Agent on every PR event or issue comment
    steps:
      - name: PR Agent action step
        id: pragent
        # pragent/pr-agent:0.50.0-github_action, pinned by digest (provenance verified
        # with `gh attestation verify --repo The-PR-Agent/pr-agent`). To upgrade, see
        # https://github.com/qodo-ai/pr-agent/blob/main/SECURITY.md
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true" # enable\disable auto review
          github_action_config.auto_describe: "true" # enable\disable auto describe
          github_action_config.auto_improve: "true" # enable\disable auto improve
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'
