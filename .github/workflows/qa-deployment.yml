name: Deploy to QA environment

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  deploy-to-qa:
    if: github.repository == 'AOT-Technologies/forms-flow-ai'
    runs-on: ubuntu-latest
    environment: 'qa'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2

      - name: Set version
        if: ${{ github.ref != 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV
      
      - name: Set version
        if: ${{ github.ref == 'refs/heads/master' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV
      
      - run: echo ${{ env.VERSION }}
      
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}
          role-session-name: github-actions-eks-deploy # Change this to your desired region
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Update Kube config
        env:
          AWS_REGION: ${{ secrets.REGION }}
          QA_EKS_CLUSTER: ${{ secrets.QA_EKS_CLUSTER }}
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$QA_EKS_CLUSTER"
      
      - name: Deploy to QA
        env:
          NAMESPACE: ${{ secrets.QA_OPENSOURCE_NAMESPACE }}
        run: |
          kubectl -n "$NAMESPACE" patch deployment forms-flow-api -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-api","image":"docker.io/formsflow/forms-flow-webapi:${{ env.VERSION }}"}]}}}}'
          kubectl -n "$NAMESPACE" patch deployment forms-flow-bpm -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-bpm","image":"docker.io/formsflow/forms-flow-bpm:${{ env.VERSION }}"}]}}}}'
          kubectl -n "$NAMESPACE" patch deployment forms-flow-data-layer -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-data-layer","image":"docker.io/formsflow/forms-flow-data-layer:${{ env.VERSION }}"}]}}}}'
          kubectl -n "$NAMESPACE" patch deployment forms-flow-documents-api -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-documents-api","image":"docker.io/formsflow/forms-flow-documents-api:${{ env.VERSION }}"}]}}}}'
          kubectl -n "$NAMESPACE" patch deployment forms-flow-web -p '{"spec":{"template":{"spec":{"containers":[{"name":"forms-flow-web","image":"docker.io/formsflow/forms-flow-web:${{ env.VERSION }}"}]}}}}'
          kubectl rollout restart deployment forms-flow-api -n "$NAMESPACE"
          kubectl rollout restart deployment forms-flow-bpm -n "$NAMESPACE"
          kubectl rollout restart deployment forms-flow-data-layer -n "$NAMESPACE"
          kubectl rollout restart deployment forms-flow-documents-api -n "$NAMESPACE"
          kubectl rollout restart deployment forms-flow-web -n "$NAMESPACE"

