name: trivy-scanning

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  security-events: write   # needed for upload-sarif
  contents: read
  actions: read

jobs:
  repo-scan:
    name: Trivy Repo Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          timeout: '20m'
          trivy-version: 'v0.69.3'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: 'trivy-results.sarif'

  image-scans:
    name: Trivy Image Scans
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "forms-flow-bpm", tag: "latest" }
          - { name: "forms-flow-forms", tag: "latest" }
          - { name: "forms-flow-webapi", tag: "latest" }
          - { name: "forms-flow-web", tag: "latest" }
          - { name: "redash", tag: "24.04.0" }
          - { name: "forms-flow-data-analysis-api", tag: "latest" }
          - { name: "forms-flow-documents-api", tag: "latest" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate with Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Install Trivy (pinned to last known clean version)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          # Pinned to v0.69.3 — last known clean version before the compromise
          sudo apt-get install -y trivy=0.69.3

      - name: Download Trivy HTML Template
        run: curl --proto '=https' --tlsv1.2 -sSf -o html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/v0.69.3/contrib/html.tpl

      - name: Run Trivy Vulnerability Scanner
        run: |
          trivy image \
          --timeout 30m \
          --template @html.tpl \
          --format template \
          --vuln-type os,library \
          --severity CRITICAL,HIGH,MEDIUM \
          --scanners vuln,secret,misconfig,license \
          --output trivy-${{ matrix.service.name }}-results.html \
          --ignorefile "${{ github.workspace }}/.trivyignore.yaml" \
          docker.io/formsflow/${{ matrix.service.name }}:${{ matrix.service.tag }}

      - name: Upload Trivy Image Scan Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.service.name }}-results
          path: trivy-${{ matrix.service.name }}-results.html
