# DevX CD Configuration — Forms Flow API
# Deployment: EKS via kubectl patch (matching existing formsflow pattern)
#
# NOTE: deployment.enabled is FALSE until:
#   1. EKS cluster/namespace are provisioned
#   2. Deployment strategy is finalized (Helm or kubectl)
# The CI pipeline already builds and pushes Docker images to ECR.

deployment:
  enabled: false                    # ← Disabled until infra is ready
  target: eks

  environments:
    dev:
      enabled: true
      region: ca-central-1
      cluster_name: formsflow-dev           # Update with actual EKS cluster name
      namespace: formsflow-dev              # Update with actual namespace
      deployment_name: forms-flow-api       # Kubernetes deployment resource name
      container_name: forms-flow-api        # Container name in the pod spec
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      notifications:
        enabled: true

    qa:
      enabled: true
      region: ca-central-1
      cluster_name: formsflow-qa
      namespace: formsflow-qa
      deployment_name: forms-flow-api
      container_name: forms-flow-api
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      notifications:
        enabled: true

    production:
      enabled: true
      region: ca-central-1
      cluster_name: formsflow-prod
      namespace: formsflow-prod
      deployment_name: forms-flow-api
      container_name: forms-flow-api
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      notifications:
        enabled: true

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/GitHubActionsRole-test
