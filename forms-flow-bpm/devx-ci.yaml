# DevX CI Configuration — Forms Flow BPM
# Language: Java 17 + Maven + Camunda

project:
  language: maven
  version: "17"
  working_directory: "./forms-flow-bpm"

build:
  enabled: true
  run_tests: true
  test_script: "mvn test -B -P camunda"
  build_script: "-B clean package -DskipTests -P camunda"
  artifact_path: "forms-flow-bpm-camunda/target/forms-flow-bpm.jar"

docker:
  enabled: true
  working_directory: "./forms-flow-bpm"
  dockerfile: "Dockerfile"
  image_name: "formsflow-bpm"
  image_tag: ""
  registry_type: ecr
  platforms: "linux/amd64"

security:
  sast:
    enabled: true
    tool: sonarqube
    scan_path: "./forms-flow-bpm"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_forms-flow-ai"
    fail_on_quality_gate: false
    coverage_report_path: "target/site/jacoco/jacoco.xml"

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret,misconfig

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium

aws:
  region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/GitHubActionsRole-test
