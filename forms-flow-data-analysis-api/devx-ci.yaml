# DevX CI Configuration — Forms Flow Data Analysis API
# Language: Python 3.11 | Sentiment Analysis (Transformers/PyTorch)

project:
  language: python
  version: "3.11"
  working_directory: "./forms-flow-data-analysis-api"

build:
  enabled: true
  run_tests: false
  test_script: "python -m pytest"
  build_script: "pip install wheel && python setup.py bdist_wheel"
  artifact_path: "dist/*.whl"

docker:
  enabled: true
  working_directory: "./forms-flow-data-analysis-api"
  dockerfile: "Dockerfile"
  image_name: "formsflow-data-analysis"
  image_tag: ""
  registry_type: ecr
  platforms: "linux/amd64"

security:
  sast:
    enabled: true
    tool: sonarqube
    scan_path: "./forms-flow-data-analysis-api"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_forms-flow-ai"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret,misconfig

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium

aws:
  region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/GitHubActionsRole-test
