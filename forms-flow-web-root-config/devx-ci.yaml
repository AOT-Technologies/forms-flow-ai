# DevX CI Configuration — Forms Flow Web Root Config
# Language: Node 18 | Micro-frontend Root (Webpack Module Federation)

project:
  language: node
  version: "18"
  working_directory: "./forms-flow-web-root-config"

build:
  enabled: true
  run_tests: false
  test_script: "npm test"
  build_script: "npm ci && npm run build"
  artifact_path: "dist/"

docker:
  enabled: true
  working_directory: "./forms-flow-web-root-config"
  dockerfile: "Dockerfile"
  image_name: "formsflow-web-root"
  image_tag: ""
  registry_type: ecr
  platforms: "linux/amd64"

security:
  sast:
    enabled: true
    tool: sonarqube
    scan_path: "./forms-flow-web-root-config"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_forms-flow-ai"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret,misconfig

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium

aws:
  region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/GitHubActionsRole-test
